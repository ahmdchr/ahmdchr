name: Update profile stats

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-profile.yml'
      - 'scripts/update_profile.py'
      - 'dark_mode_v2.svg'
      - 'light_mode_v2.svg'

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Restore immutable commit statistics
        uses: actions/cache@v4
        with:
          path: .cache/commit-stats.json
          key: profile-commits-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: profile-commits-v1-
      - name: Refresh and publish statistics
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_USER: ahmdchr
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            # This is a disposable Actions checkout. Discard only this job's
            # generated commit, then rebuild against the latest remote files.
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/update_profile.py
            git add dark_mode_v2.svg light_mode_v2.svg
            if git diff --cached --quiet; then
              echo "Statistics are already current."
              exit 0
            fi
            git commit -m "Update profile statistics"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push failed on attempt ${attempt}; fetching current main before retry."
          done
          echo "Could not publish after three attempts. Check branch rules and the push error above."
          exit 1
