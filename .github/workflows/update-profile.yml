name: Update profile stats

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-profile.yml'
      - 'scripts/update_profile.py'
      - 'dark_mode_v2.svg'
      - 'light_mode_v2.svg'

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Refresh both SVGs
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_USER: ahmdchr
        run: python3 scripts/update_profile.py
      - name: Commit updated statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode_v2.svg light_mode_v2.svg
          if git diff --cached --quiet; then
            echo "Statistics are already current."
            exit 0
          fi
          git commit -m "Update profile statistics"
          git push origin HEAD:main
